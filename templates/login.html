{% extends "base.html" %}

{% block content %}
    <!-- Blurred Teaser Background -->
    <div style="filter: blur(1px); pointer-events: none; user-select: none; opacity: 0.75; max-height: 300vh; overflow: hidden;">
        {% include "partials/_activity_content.html" ignore missing %}
    </div>

    <!-- Login Overlay -->
    <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
                display: flex; justify-content: center; align-items: center; 
                background: rgba(0, 0, 0, 0.15); z-index: 1050;
                backdrop-filter: blur(1px);">
        
        <div class="card shadow-lg border-0" style="width: 90%; max-width: 400px; border-radius: 12px; overflow: hidden;">
            <div class="card-body p-5 text-center">

                <h2 class="fw-semibold mb-3">Cycling Stats</h2>
                
                <div class="d-flex justify-content-center mb-3">
                    <a href="{{ url_for('auth.login') }}">
                        <img src="{{ url_for('static', filename='images/btn_strava_connect_with_orange.svg') }}" 
                            alt="Connect with Strava" 
                            style="height: 48px;">
                    </a>
                </div>

                <p class="text-muted small mx-auto" style="max-width: 230px;">
                    to view your personalized training metrics.
                </p>

                <div class="mt-3 pt-4 border-top">
                    <img src="{{ url_for('static', filename='images/api_logo_cptblWith_strava_horiz_black.svg') }}" 
                        alt="Compatible with Strava" 
                        style="height: 20px; width: auto; opacity: 1.0;">
                </div>
            </div>
        </div>
    </div>
{% endblock %}
